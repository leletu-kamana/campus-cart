<!DOCTYPE html>
<!-- Custom "page not found" page. GitHub Pages shows this file for any address that does not exist. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Campus-Cart</title>
    <meta name="description" content="This Campus-Cart page could not be found. Return to the home page or browse student essentials.">
    <!-- noindex stops search engines listing this error page. -->
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0d1b3e">
    <!-- Absolute paths are used because this page can be shown at any address on the site. -->
    <link rel="stylesheet" href="https://leletu-kamana.github.io/campus-cart/assets/css/styles.css">
</head>
<body>
    <main>
        <section class="section">
            <div class="wrap">
                <div class="section-head">
                    <span class="eyebrow">Error 404</span>
                    <h1>We could not find that page</h1>
                    <p>The link may be old or mistyped. Try one of these instead:</p>
                </div>
                <p>
                    <a class="btn" href="https://leletu-kamana.github.io/campus-cart/index.html">Go to the home page</a>
                    <a class="btn btn-outline" href="https://leletu-kamana.github.io/campus-cart/pages/products.html">Shop student essentials</a>
                    <a class="btn btn-outline" href="https://leletu-kamana.github.io/campus-cart/pages/contact.html">Contact us</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
