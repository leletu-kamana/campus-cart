<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus-Cart | Account &amp; Order Summary</title>
  <link rel="stylesheet" href="/campus-cart/assets/css/styles.css">
</head>
<body>

  <header>
    <nav>
      <a href="/campus-cart/index.html" class="logo">Campus-Cart</a>
      <ul class="nav-links">
        <li><a href="products.html#shop">Shop</a></li>
        <li><a href="products.html#deals-gallery">Deals &amp; Gallery</a></li>
        <li><a href="products.html#parent-hub">Parent Hub</a></li>
        <li><a href="products.html#sell-with-us">Sell With Us</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="enquiry.html">Enquiry</a></li>
        <li><a href="account.html">Account</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="student"> <!-- This id is where index.html's "I am a Student" button lands -->
      <h1>Student</h1>
      <p><!-- Static Student path info goes here --></p>
    </section>

    <section id="parent"> <!-- Matching section for the "I am a Parent/Guardian" button -->
      <h1>Parent/Guardian</h1>
      <p><!-- Static Parent path info goes here --></p>
    </section>

    <section id="order-summary"> <!-- Acts as the site's cart, even though there's no real backend behind it -->
      <h2>Order Summary</h2>

      <ul id="order-items"> <!-- Left empty here, script.js appends list items whenever "Add to Order Summary" is clicked on products.html -->
        <!-- Items added from products.html go here (session-only) -->
      </ul>

      <p id="order-total"><!-- Order total --></p> <!-- Given an id so the running total can be updated by JS as items are added -->

      <div id="skip-to-address"> <!-- Named after the "Skip to Address" step mentioned in the original project brief -->
        <h3>Delivery / Collection Details</h3>
        <label for="address">Address or Collection Point</label>
        <input type="text" id="address" name="address"> <!-- Plain text field, since there's no backend to validate this against anyway -->
      </div>

      <div id="checkout"> <!-- Final step, but it hands off rather than actually processing payment -->
        <h3>Complete Your Order</h3>
        <a href="#" class="btn" id="whatsapp-checkout">Order via WhatsApp</a> <!-- Href left as a placeholder until the actual WhatsApp link is generated by JS -->
        <a href="mailto:orders@campus-cart.co.za" class="btn">Order via Email</a> <!-- This one works immediately, no JS required, since mailto is native to the browser -->
        <p><!-- EFT / manual payment instructions go here --></p>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Campus-Cart. All rights reserved.</p>
  </footer>

  <script src="/campus-cart/assets/js/script.js"></script>
</body>
</html>
